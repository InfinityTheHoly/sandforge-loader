<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vein Snake — SandForge</title>
    <style>
      html, body { margin: 0; height: 100%; background: #140e0a; color: #e8dcc8; font: 12px/1.35 "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
      .wrap { box-sizing: border-box; height: 100%; padding: 10px 12px; display: flex; flex-direction: column; }
      .top { display: flex; justify-content: space-between; align-items: baseline; }
      .banner { margin: 0; color: #ffe700; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; font-size: 11px; }
      .sub { margin: 0; color: #8a7a62; font-size: 11px; }
      .bar { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
      button { background: #2a1c10; color: #ffe700; border: 1px solid #6b4a2a; border-radius: 2px 8px 2px 8px; padding: 5px 10px; font: 700 11px/1 "Segoe UI", sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
      button:hover { border-color: #ffe700; }
      .hud { margin-left: auto; display: flex; gap: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #cbb89a; }
      .hud b { color: #ffe700; }
      canvas { display: block; background: #1a120c; border: 1px solid #5a3d22; border-radius: 2px 10px 2px 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <p class="banner">Vein Snake</p>
        <p class="sub">Arrows / WASD. Eat ore. Bedrock and your own vein kill you.</p>
      </div>
      <div class="bar">
        <button type="button" id="back">Arcade</button>
        <button type="button" id="new">New vein</button>
        <div class="hud">
          <span>Score <b id="score">0</b></span>
          <span>Best <b id="best">0</b></span>
        </div>
      </div>
      <canvas id="c" width="700" height="476"></canvas>
    </div>
    <script>
      (function () {
        var COLS = 25, ROWS = 17, CELL = 28;
        var ORE = [
          { name: "copper", color: "#c46a2d", pts: 1 },
          { name: "iron", color: "#c5cdd4", pts: 2 },
          { name: "gold", color: "#ffe700", pts: 4 },
        ];
        var canvas = document.getElementById("c");
        var ctx = canvas.getContext("2d");
        var snake, dir, nextDir, food, score, best, alive, acc, speed;
        function sf() { return window.sandforge || window.sandforgeAPI || null; }
        function invoke() {
          var b = sf();
          if (!b || !b.invoke) return Promise.reject();
          return b.invoke.apply(b, arguments);
        }
        function hud() {
          document.getElementById("score").textContent = String(score);
          document.getElementById("best").textContent = String(best);
        }
        function emptyCell() {
          var used = {};
          snake.forEach(function (p) { used[p.x + "," + p.y] = 1; });
          for (var n = 0; n < 200; n++) {
            var x = (Math.random() * COLS) | 0;
            var y = (Math.random() * ROWS) | 0;
            if (!used[x + "," + y]) return { x: x, y: y };
          }
          return { x: 1, y: 1 };
        }
        function placeFood() {
          var cell = emptyCell();
          var roll = Math.random();
          food = Object.assign({ x: cell.x, y: cell.y }, roll > 0.82 ? ORE[2] : roll > 0.5 ? ORE[1] : ORE[0]);
        }
        function reset() {
          var sx = (COLS / 2) | 0, sy = (ROWS / 2) | 0;
          snake = [{ x: sx, y: sy }, { x: sx - 1, y: sy }, { x: sx - 2, y: sy }];
          dir = { x: 1, y: 0 };
          nextDir = dir;
          score = 0;
          alive = true;
          acc = 0;
          speed = 7.2;
          placeFood();
          hud();
        }
        function persistBest() {
          if (score <= best) return;
          best = score;
          invoke("sandforge.example:arcade-score", { game: "snake", score: best }).catch(function () {});
        }
        function die() {
          if (!alive) return;
          alive = false;
          persistBest();
          hud();
        }
        function step() {
          if (!alive) return;
          dir = nextDir;
          var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
          if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return die();
          for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) return die();
          }
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score += food.pts;
            persistBest();
            speed = Math.min(14, speed + 0.12);
            placeFood();
            hud();
          } else snake.pop();
        }
        function draw() {
          ctx.fillStyle = "#1a120c";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = "rgba(255,231,0,0.06)";
          for (var x = 0; x <= COLS; x++) {
            ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
          }
          for (var y = 0; y <= ROWS; y++) {
            ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
          }
          ctx.fillStyle = food.color;
          ctx.beginPath();
          ctx.arc(food.x * CELL + 14, food.y * CELL + 14, 8, 0, Math.PI * 2);
          ctx.fill();
          snake.forEach(function (p, i) {
            ctx.fillStyle = i === 0 ? "#ffe700" : i % 2 ? "#c9a227" : "#8a7018";
            ctx.fillRect(p.x * CELL + 2, p.y * CELL + 2, CELL - 4, CELL - 4);
          });
          if (!alive) {
            ctx.fillStyle = "rgba(10,8,6,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffe700";
            ctx.font = "700 28px Segoe UI,sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("VEIN COLLAPSED", canvas.width / 2, canvas.height / 2 - 4);
            ctx.fillStyle = "#e8dcc8";
            ctx.font = "13px Segoe UI,sans-serif";
            ctx.fillText(score + " ore  ·  N for a new vein", canvas.width / 2, canvas.height / 2 + 22);
          }
        }
        var last = 0;
        function loop(t) {
          if (!last) last = t;
          acc += (t - last) / 1000;
          last = t;
          var stepAt = 1 / speed;
          while (alive && acc >= stepAt) {
            acc -= stepAt;
            step();
          }
          draw();
          requestAnimationFrame(loop);
        }
        function setDir(x, y) {
          if (dir.x === -x && dir.y === -y) return;
          nextDir = { x: x, y: y };
        }
        window.addEventListener("keydown", function (e) {
          if (e.key === "Escape") location.href = "arcade.html";
          if (e.key === "n" || e.key === "N") reset();
          if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") setDir(0, -1);
          if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") setDir(0, 1);
          if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") setDir(-1, 0);
          if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") setDir(1, 0);
        });
        document.getElementById("back").onclick = function () { location.href = "arcade.html"; };
        document.getElementById("new").onclick = reset;
        best = 0;
        reset();
        requestAnimationFrame(loop);
        (function boot(n) {
          var b = sf();
          if (b && b.invoke) {
            invoke("sandforge.example:arcade-boot").then(function (s) {
              best = (s && s.snakeBest) || 0;
              hud();
            }).catch(function () {});
            return;
          }
          if (n < 80) setTimeout(function () { boot(n + 1); }, 50);
        })(0);
      })();
    </script>
  </body>
</html>
